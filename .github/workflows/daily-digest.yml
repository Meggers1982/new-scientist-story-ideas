name: Daily New Scientist Story Ideas

on:
  schedule:
    # 12:00 UTC every day (07:00 ET, 08:00 EDT)
    - cron: "0 12 * * *"

  # Allow manual runs with an optional focus override
  workflow_dispatch:
    inputs:
      focus:
        description: >
          Subject focus override (leave blank to use today's rotation).
          Examples: "memory", "sleep", "psychotherapy"
        required: false
        default: ""

jobs:
  digest:
    name: Generate story-ideas digest
    runs-on: ubuntu-latest
    # A healthy run is well under this; the cap makes a hang fail fast rather
    # than sitting on GitHub's six-hour default.
    timeout-minutes: 40

    permissions:
      contents: write   # Needed to commit digest files back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest pipeline
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DIGEST_FOCUS: ${{ github.event.inputs.focus }}
        working-directory: scripts
        run: python main.py

      - name: Commit digest outputs
        run: |
          git config user.name  "story-ideas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add outputs/ topic_memory/ docs/ seen_pmids.json
          git diff --cached --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          # Another run (or a manual push) may have landed while this one worked.
          git pull --rebase origin main && git push
